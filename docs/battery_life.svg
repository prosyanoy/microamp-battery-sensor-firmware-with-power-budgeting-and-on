<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" font-family="sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#fff"/>
<text x="380.0" y="26" text-anchor="middle" font-size="16" font-weight="bold">Estimated battery life by firmware design (225 mAh cell, assumed current model)</text>
<text x="220" y="83.0" text-anchor="end">polling (before)</text>
<rect x="230" y="60" width="19.6" height="38" fill="#8a8f98"/>
<text x="257.6" y="83.0">0.04 years (501 µA avg)</text>
<text x="220" y="145.0" text-anchor="end">+ FIFO batching + tickless</text>
<rect x="230" y="122" width="215.4" height="38" fill="#3b7ddd"/>
<text x="453.4" y="145.0">0.44 years (49 µA avg)</text>
<text x="220" y="207.0" text-anchor="end">+ wake-on-motion gating</text>
<rect x="230" y="184" width="328.0" height="38" fill="#1b9e77"/>
<text x="566.0" y="207.0">0.67 years (32 µA avg)</text>
<text x="230" y="282" fill="#555">Same simulated scenario for all designs; currents are assumed, not bench-measured.</text></svg>
